version: "3.0"

market_opportunity:
  max_score: 100

  factors:
    structural_demand_growth:
      weight: 20

    supply_constraint:
      weight: 20

    capital_flow_confirmation:
      weight: 15

    order_visibility:
      weight: 15

    under_recognition:
      weight: 15

    beneficiary_concentration:
      weight: 15

  thresholds:
    active: 75
    watchlist: 55

discovery:
  max_score: 100

  factors:
    demand_acceleration:
      weight: 15

    scarcity_supply_constraint:
      weight: 15

    backlog_orders:
      weight: 15

    capacity_expansion:
      weight: 10

    revenue_acceleration:
      weight: 10

    margin_inflection:
      weight: 10

    estimate_revisions:
      weight: 10

    competitive_advantage:
      weight: 5

    balance_sheet_runway:
      weight: 5

    valuation:
      weight: 5

  thresholds:
    tier_a: 80
    tier_b: 65
    watchlist: 50

regime:
  version: "1.0"
  precedence:
    - capitulation_reversal
    - risk_off
    - risk_on
    - risk_on_narrow
    - neutral_chop

  rules:
    risk_on:
      regime: 1
      requires:
        - spy_above_50dma
        - dma50_above_200dma
        - dma50_rising
        - dma200_rising
        - breadth_healthy
        - advancers_leading
        - new_highs_expanding

    risk_on_narrow:
      regime: 2
      requires:
        - index_trending_up
        - breadth_deteriorating
        - leadership_concentrated

    neutral_chop:
      regime: 3
      requires:
        - index_sideways_around_50dma
        - breadth_mixed
        - breakouts_failing_both_ways

    risk_off:
      regime: 4
      requires:
        - spy_below_50dma
        - breadth_deteriorating
        - new_lows_expanding

    capitulation_reversal:
      regime: 5
      requires:
        - breadth_washed_out
        - volatility_spiking
        - early_reclaim_attempts

setup_score:
  version: "1.0"
  max_score: 100

  factors:
    trend_alignment:
      weight: 25

    relative_strength_vs_spy:
      weight: 25

    structure_quality:
      weight: 25

    liquidity_volume_confirmation:
      weight: 15

    earnings_distance_safety:
      weight: 10

  thresholds:
    planned_size: 70
    unproven_size: 50

  swing_long_screen:
    min_avg_daily_volume: 500000
    max_extension_pct_50dma: 10
    min_days_to_earnings: 10

swing_triggers:
  version: "1.0"
  min_setup_score: 70

  breakout_retest:
    stop_below_base_pct_min: 3
    stop_below_base_pct_max: 5

  ema21_pullback:
    max_tap_number: 2

