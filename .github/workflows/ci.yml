name: ATS Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ats_ci
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats_ci -d ats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ATS_TEST_DATABASE_URL: postgresql+psycopg://ats_ci:ci-test-password@127.0.0.1:5432/ats_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,webull]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: PostgreSQL integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_postgres_persistence.py -q -rs --fail-on-skip | tee postgres-results.txt
          if grep -Eq '[0-9]+ skipped|SKIPPED' postgres-results.txt; then
            echo "PostgreSQL tests were skipped"
            exit 1
          fi

      - name: Full test suite
        run: python -m pytest -q -rs --fail-on-skip

      - name: Replay simulation acceptance report
        if: always()
        run: python -m src.replay_acceptance --output replay-acceptance.json

      - name: Upload replay acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-acceptance-report
          path: replay-acceptance.json
          if-no-files-found: warn
