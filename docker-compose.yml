services:
  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://ats_app:${ATS_APP_PASSWORD:?Set ATS_APP_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ats}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ats}
      POSTGRES_USER: ${POSTGRES_USER:-ats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  provision-runtime-role:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-ats}
      PGUSER: ${POSTGRES_USER:-ats}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ATS_APP_PASSWORD: ${ATS_APP_PASSWORD:?Set ATS_APP_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        psql --set=ON_ERROR_STOP=1
        --set=app_password="$$ATS_APP_PASSWORD"
        --set=migration_role="$$PGUSER"
        --file=/provision-runtime-role.sql
    volumes:
      - ./docker/provision-runtime-role.sql:/provision-runtime-role.sql:ro
    restart: "no"

  migrate:
    build:
      context: .
    depends_on:
      provision-runtime-role:
        condition: service_completed_successfully
    environment:
      ATS_RUNTIME_ROLE: ats_app
      ATS_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ats}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ats}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

volumes:
  postgres_data:
